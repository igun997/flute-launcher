name: focus_launcher
description: Flute, a lightweight launcher that boosts your productivity (not only focus).
publish_to: none
version: 0.2.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  enough_mail: ^3.0.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  rinf: ^8.11.0
  tuple: ^2.0.2
  mcp_dart: ^2.4.4
  gpt_markdown: ^1.4.1
  flutter_animate: ^4.5.2
  device_calendar_plus: ^0.12.0
  flutter_contacts: ^2.6.0
  image_picker: ^1.2.4
  file_picker: ^13.4.0
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  crypto: ^3.0.8
  archive: ^4.7.1
  yaml: ^3.1.4
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
# jni 1.2.0 / jni_flutter 1.1.0 fail at startup on the phone with
# ClassNotFoundException "Landroid/content/Context;" (path_provider and shared_preferences use them).
dependency_overrides:
  jni: 1.1.2
  jni_flutter: 1.0.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  shaders:
    - shaders/sky.frag
    - shaders/transition.frag
    - shaders/glow.frag
    - shaders/orb.frag
    - shaders/imagine.frag
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-Medium.ttf
          weight: 500

  assets:
    - assets/brand/
    - assets/art/
    - assets/data/
    - assets/icons/
    - assets/pets/
    - assets/pets/kiri/
    - assets/pets/luma/
    - assets/pets/momo/
    - assets/pets/nori/
    - assets/pets/pip/
    - assets/pets/sora/
