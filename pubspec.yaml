name: focus_launcher
description: Focus Launcher.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  enough_mail: ^3.0.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  shaders:
    - shaders/sky.frag
    - shaders/transition.frag
    - shaders/glow.frag
  assets:
    - assets/brand/
    - assets/art/
    - assets/data/
    - assets/icons/
    - assets/pets/
    - assets/pets/kiri/
    - assets/pets/luma/
    - assets/pets/momo/
    - assets/pets/nori/
    - assets/pets/pip/
    - assets/pets/sora/
