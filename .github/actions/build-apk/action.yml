name: Build signed release APK
description: >
  Builds the arm64 release APK. When the keystore inputs are set the APK is signed with that key;
  otherwise Gradle falls back to the debug key (forks and local builds).
inputs:
  build-name:
    description: Version name shown to the user (for example 0.1.0 or 0.1.0-nightly.abc1234).
    required: true
  build-number:
    description: Android versionCode. Must only ever grow.
    required: true
  keystore-base64:
    description: Base64 of the release keystore (.jks / PKCS12).
    required: false
    default: ""
  keystore-password:
    required: false
    default: ""
  key-alias:
    required: false
    default: ""
  key-password:
    required: false
    default: ""
outputs:
  apk:
    description: Path of the APK that was built.
    value: ${{ steps.collect.outputs.apk }}
  signer-sha256:
    description: SHA-256 fingerprint of the certificate the APK is signed with.
    value: ${{ steps.collect.outputs.signer }}
runs:
  using: composite
  steps:
    - name: Install signing key
      if: inputs.keystore-base64 != ''
      shell: bash
      env:
        KEYSTORE_B64: ${{ inputs.keystore-base64 }}
        STORE_PASS: ${{ inputs.keystore-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASS: ${{ inputs.key-password }}
      run: |
        set -euo pipefail
        echo "$KEYSTORE_B64" | base64 -d > android/release.jks
        {
          echo "storeFile=release.jks"
          echo "storePassword=$STORE_PASS"
          echo "keyAlias=$KEY_ALIAS"
          echo "keyPassword=$KEY_PASS"
        } > android/key.properties
        chmod 600 android/release.jks android/key.properties

    - name: Build
      shell: bash
      run: >
        flutter build apk --release --target-platform android-arm64
        --build-name "${{ inputs.build-name }}" --build-number "${{ inputs.build-number }}"

    - name: Verify signature and collect
      id: collect
      shell: bash
      run: |
        set -euo pipefail
        src=build/app/outputs/flutter-apk/app-release.apk
        apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
        "$apksigner" verify --verbose "$src" | head -5
        signer=$("$apksigner" verify --print-certs "$src" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
        [ -n "$signer" ] || { echo "could not read the signing certificate"; exit 1; }
        out="flute-${{ inputs.build-name }}-arm64-v8a.apk"
        cp "$src" "$out"
        sha256sum "$out" > "$out.sha256"
        echo "apk=$out" >> "$GITHUB_OUTPUT"
        echo "signer=$signer" >> "$GITHUB_OUTPUT"

    - name: Remove signing key
      if: always()
      shell: bash
      run: rm -f android/release.jks android/key.properties
