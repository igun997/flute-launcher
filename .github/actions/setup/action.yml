name: Set up Flutter
description: JDK 17, Flutter (stable) and project dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - run: flutter --version
      shell: bash
    - run: flutter pub get
      shell: bash
